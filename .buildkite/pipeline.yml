env:
  CI: "1"

steps:
  - label: ":unreal: Plugin and native bridge contracts"
    command: |
      set -euo pipefail
      test -f Nuxie.uplugin
      node ./scripts/test-trigger-contract.mjs
      ./scripts/test-android-bridge.sh
    agents:
      queue: nuxie-pr
      nuxie-platform: macos
    timeout_in_minutes: 30
    retry:
      automatic:
        - exit_status: -1
          limit: 1
